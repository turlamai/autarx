name: Product Acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  RIVET_PIN: 8db939999ded6bde9696fbc420730a9f86901c77

concurrency:
  # Keep each main commit's packaged product-acceptance proof independent.
  # GitHub coalesces pending workflow runs sharing a concurrency group.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows packaged WinUI acceptance
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.16
        with:
          version: '9.3'
          architecture: x64
          distribution: full
          variant: CS
      - name: Install pinned dependencies and link core
        shell: pwsh
        run: |
          raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#$env:RIVET_PIN" crypto
          raco pkg install --auto --no-docs --name autarx-core --link racket
      - name: Run executable product acceptance
        run: raco rivet acceptance --json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autarx-acceptance-windows
          path: .rivet/acceptance/
          if-no-files-found: warn

  macos:
    name: macOS packaged SwiftUI acceptance (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.16
        with:
          version: '9.3'
          architecture: ${{ matrix.arch }}
          distribution: full
          variant: CS
      - name: Install pinned dependencies and link core
        run: |
          raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${RIVET_PIN}" crypto
          raco pkg install --auto --no-docs --name autarx-core --link racket
      - name: Run executable product acceptance
        run: raco rivet acceptance --json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autarx-acceptance-macos-${{ matrix.arch }}
          path: .rivet/acceptance/
          if-no-files-found: warn

  linux:
    name: Linux packaged GTK4 acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.16
        with:
          version: '9.3'
          architecture: x64
          distribution: full
          variant: CS
      - name: Install native and accessibility dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgtk-4-dev libglib2.0-dev libsecret-1-dev \
            liblz4-dev zlib1g-dev libncurses-dev weston at-spi2-core python3-pyatspi
      - name: Install pinned dependencies and link core
        run: |
          raco pkg install --auto --no-docs "https://github.com/turlamai/rivet.git#${RIVET_PIN}" crypto
          raco pkg install --auto --no-docs --name autarx-core --link racket
      - name: Remember full Racket command path
        run: echo "FULL_RACKET_BIN=$(dirname "$(command -v raco)")" >> "$GITHUB_ENV"
      # Keep the action ref in lockstep with RIVET_PIN above — it ships the
      # runtime the pinned rivet expects.
      - name: Set up embeddable Racket CS
        uses: turlamai/rivet/.github/actions/setup-embed-racket@8db939999ded6bde9696fbc420730a9f86901c77
      - name: Run executable product acceptance
        run: PATH="$FULL_RACKET_BIN:$PATH" dbus-run-session -- raco rivet acceptance --json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: autarx-acceptance-linux
          path: .rivet/acceptance/
          if-no-files-found: warn
