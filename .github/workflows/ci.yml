name: ci

# Contract tests + host build on every push/PR to the migration line.
on:
  push:
    branches: [main, experiment/autarx-rivet]
  pull_request:
    branches: [main, experiment/autarx-rivet]

# Single source of truth for the rivet pin; every install step below
# references this so a bump is one edit, not a grep-replace across jobs.
env:
  RIVET_PIN: 179319936c6a22b2fa676c0fd557bcdb05ee5205
concurrency:
  # Keep an independent quality gate for every main commit. GitHub coalesces
  # queued runs sharing a group even when cancel-in-progress is disabled.
  # Only superseded attempts for the same pull request should be cancelled.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Offline python contract check of the release tooling — runs wherever
  # the scripts are easiest to run; it promises nothing about platforms.
  release-contract:
    name: Offline release trust-root contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Ed25519 release trust roots and canonical update feeds
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_signing.py'

  # Windows is the only shipped platform (issue #56): the engine tests run
  # on the release surface, not on adjacent platforms.
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'

      - name: Install Rivet (catalog)
        shell: bash
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'

      - name: Install autarx core
        shell: bash
        # cygpath -m: Racket needs a Windows-mixed path in the file:// URL —
        # git-bash's $PWD is a POSIX path Racket cannot resolve.
        run: raco pkg install --auto --no-docs --name autarx-core --link "file://$(cygpath -m "$PWD/racket")"

      - name: Contract tests (+ update channels)
        shell: bash
        run: raco test racket/

      - name: CLI exit-code smoke
        shell: bash
        run: |
          # expected non-zero exits below must not trip bash -e
          set +e
          racket racket/autarx/cli.rkt inspect shared/fixtures/OemDelivery --json > /dev/null
          inspect_rc=$?
          racket racket/autarx/cli.rkt unresolved shared/fixtures/OemDelivery --json > /dev/null
          unresolved_rc=$?
          racket racket/autarx/cli.rkt diff shared/fixtures/DiffBefore shared/fixtures/DiffAfter --json > /dev/null
          diff_rc=$?
          set -e
          test "$inspect_rc" -eq 0
          test "$unresolved_rc" -eq 1
          test "$diff_rc" -eq 1

  windows-host:
    name: Windows host (WinRT build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (catalog)
        shell: bash
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Install crypto (updater dependency)
        shell: pwsh
        run: raco pkg install --auto --no-docs crypto
      - name: Install autarx core
        shell: bash
        # cygpath -m: Racket needs a Windows-mixed path in the file:// URL —
        # git-bash's $PWD is a POSIX path Racket cannot resolve.
        run: raco pkg install --auto --no-docs --name autarx-core --link "file://$(cygpath -m "$PWD/racket")"
      - name: Build host
        shell: pwsh
        run: raco rivet build
