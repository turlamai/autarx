name: Release

on:
  push:
    tags: ["v*"]

env:
  # Single pin source, same value as ci.yml. Release used to reference
  # env.RIVET_PIN without defining it: the empty ref made `raco pkg
  # install 'URL#'` silently resolve to rivet main-HEAD, so release
  # artifacts were built from an untested commit while the contract tests
  # ran the pinned version (v0.4.1 / v0.4.2 shipped this way).
  RIVET_PIN: c96673ded75651c94a1d513b122691f85d76ccf5
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          version: stable
          distribution: full
      - name: Check release tag against the version single source
        run: bash scripts/check-release-version.sh "$GITHUB_REF_NAME"
      # Fail before native packaging if the secret cannot authenticate both feeds.
      - name: Verify Ed25519 release key matches all updater trust roots
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: python3 scripts/check-update-signing-key.py

  cli:
    name: CLI zip (windows-x64)
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: x64
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
        shell: bash
      - name: Link autarx core
        run: raco pkg install --auto --no-docs --name autarx-core --link "file://$(cygpath -m "$GITHUB_WORKSPACE/racket")"
        shell: bash
      - name: Build CLI distribution
        run: bash scripts/build-cli.sh dist-cli
      - uses: actions/upload-artifact@v7
        with:
          name: cli-windows-x64
          path: dist-cli/autarx-*.zip
          if-no-files-found: error

  windows:
    name: Windows workbench (x64)
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: x64
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        shell: bash
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Install WiX (v5; rivet's MSI toolchain)
        shell: bash
        run: dotnet tool install --global wix --version 5.0.2
      - name: Install crypto (updater dependency)
        shell: pwsh
        run: raco pkg install --auto --no-docs crypto
      - name: Link autarx core
        shell: bash
        # cygpath -m: Racket needs a Windows-mixed path in the file:// URL —
        # git-bash's $PWD is a POSIX path Racket cannot resolve.
        run: raco pkg install --auto --no-docs --name autarx-core --link "file://$(cygpath -m "$PWD/racket")"
      - name: Release (MSI + portable zip)
        shell: pwsh
        run: raco rivet release --without-updates --development
      - name: Family naming
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          # The portable zip is the workbench update payload and gets the
          # family -app suffix — the plain name belongs to the CLI zip (the
          # separate cli job ships it). The MSI keeps the plain family name:
          # the updater derives its release URL from the feed zip entry.
          mv "autarx-${VERSION}-windows-x64.zip" \
             "autarx-${VERSION}-windows-x64-app.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/autarx-*
          if-no-files-found: error

  release:
    name: Publish
    needs: [cli, windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: arm64
          version: stable
          distribution: full
      - name: Install Rivet (catalog)
        run: raco pkg install --auto --no-docs 'https://github.com/turlamai/rivet.git#${{ env.RIVET_PIN }}'
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Flatten artifact dirs
        run: |
          find dist -mindepth 2 -maxdepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -maxdepth 1 -type d -empty -delete
          ls -la dist/
      - name: Per-asset .sha256 sidecars
        run: |
          cd dist
          for f in autarx-*; do
            case "$f" in
              *.sha256) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || shasum -a 256 "$f" > "$f.sha256" ;;
            esac
          done
      - name: Sign the CLI update feed (update-manifest.json)
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          # Fail-closed: no key, no release. Starting with 0.4.1 the CLI
          # feed is an Ed25519 signed wrapper — an unauthenticated feed is
          # the supply-chain gap this retires (shared/spec/UPDATE.md).
          racket scripts/make-update-feed.rkt \
            "${{ github.ref_name }}" dist \
            "https://github.com/turlamai/autarx/releases/download/${{ github.ref_name }}"
      - name: Sign the workbench update manifest (update-app-manifest.json)
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          # Fail-closed, same contract as the CLI feed above: no key, no
          # release. The Windows host verifies the wrapper signature
          # through the backend updater before parsing — so shipping
          # without the feed would strand every installed copy on "release
          # has no update manifest".
          if [ -z "$UPDATE_ED25519_PRIVATE_KEY_B64" ]; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY_B64 is not set — refusing to publish without the signed workbench feed (shared/spec/UPDATE.md)"
            exit 1
          fi
          keyder="$(mktemp /tmp/autarx-key-XXXXXX)"
          printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$keyder"
          bash scripts/make-update-manifest.sh "${{ github.ref_name }}" dist "$keyder"
          rm -f "$keyder"
      - name: Validate and stage CLI and workbench release contracts
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$GITHUB_REF_NAME" | cut -c2-)"
          mkdir -p public
          # CLI archives and native workbench installers have intentionally
          # distinct roles. *-app.* is a signed-feed update payload.
          for suffix in \
            windows-x64.msi windows-x64.zip windows-x64-app.zip; do
            name="autarx-$VERSION-$suffix"
            test -s "dist/$name" || { echo "::error::Missing or empty $name"; exit 1; }
            cp "dist/$name" "public/$name"
          done
          cp dist/update-app-manifest.json dist/update-manifest.json public/
          test -s public/update-app-manifest.json && test -s public/update-manifest.json
          cd public
          shasum -a 256 autarx-* | LC_ALL=C sort -k2 > SHA256SUMS
          shasum -a 256 --check SHA256SUMS
          # MSI + portable app zip + CLI zip.
          test "$(grep -c '^' SHA256SUMS)" -eq 3
      - name: Release notes from this version's changelog
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$GITHUB_REF_NAME" | cut -c2-)"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "::error::Missing changelog section $VERSION"; exit 1; }
          printf '\n### Distribution and trust\n\n' >> release-notes.md
          printf '%s\n' 'Autarx ships Windows-only. The CLI ZIP and workbench *-app payloads are separate update targets. Verify downloads with SHA256SUMS.' >> release-notes.md
          printf '%s\n' 'Windows installers have no publisher signature; SmartScreen may warn. Update manifests are independently Ed25519-signed.' >> release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$GITHUB_REF_NAME" | cut -c2-)"
          if gh release view "$GITHUB_REF_NAME" -R turlamai/autarx >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" -R turlamai/autarx --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" public/* --clobber -R turlamai/autarx
          else
            gh release create "$GITHUB_REF_NAME" public/* \
              -R turlamai/autarx \
              --title "Autarx $VERSION" \
              --notes-file release-notes.md
          fi
          gh release view "$GITHUB_REF_NAME" -R turlamai/autarx --json assets --jq '.assets[].name' |
            while IFS= read -r name; do
              if [ ! -f "public/$name" ]; then
                gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes -R turlamai/autarx
              fi
            done
      - name: Attest public build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: public/*
